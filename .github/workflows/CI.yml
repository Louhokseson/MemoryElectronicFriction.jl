name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1' # This will use the latest 1.x version, e.g., 1.10.x or 1.11.x
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # --- NEW STEP: Add your private Julia registry ---
      - name: Add HokseonRegistry
        run: |
          julia -e '
            using Pkg
            Pkg.add(url="https://github.com/Louhokseson/HokseonRegistry.git")
          '
        # Since your registry is public, this `Pkg.add` with the URL should suffice.
        # No authentication (like GITHUB_TOKEN) is needed for public repos.

      - uses: julia-actions/cache@v1 # This caches your dependencies
      - uses: julia-actions/julia-buildpkg@v1 # This runs Pkg.instantiate() and Pkg.build()

      - name: Run tests
        run: >
          julia --project=. --color=yes test/runtests.jl