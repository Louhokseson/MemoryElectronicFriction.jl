name: CI
on:
  push:
    branches:
      - main
      - fix-ci-workflow
    tags: '*'
  pull_request:
permissions:
  actions: write   # julia-actions/cache: cleanup of old caches
  contents: read
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11' # latest 1.11.x patch — must stay in sync with Manifest.toml's julia_version
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # --- Add your HokseonRegistry ---
      - name: Add HokseonRegistry
        run: julia -e 'using Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/Louhokseson/HokseonRegistry.git"))'
        shell: bash

      # --- ADD THIS STEP: Add NQCRegistry because NQCModels (and thus NQCBase) needs it ---
      - name: Add NQCRegistry
        run: julia -e 'using Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/NQCD/NQCRegistry.git"))'
        shell: bash

      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        run: >
          julia --project=. --color=yes test/runtests.jl